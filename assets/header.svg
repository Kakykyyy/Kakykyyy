      @keyframes charge { to { stroke-dashoffset: -52; } }
      @keyframes spark { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      .ring { animation: charge 6s linear infinite; }
      .spark { animation: spark 2.8s ease-in-out infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse, .ring, .spark { animation: none; } }
    </style>
